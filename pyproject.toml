[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-context-scout"
version = "0.1.0"
description = "Enterprise Dual-Engine Context Scout & Multi-Domain Knowledge Platform (Gemma 4 MoE, Google ADK 2.12, MCP 2.3, PostgreSQL 17 RLS + pgvector)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "psycopg[binary,pool]>=3.2.3,<4.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "tree-sitter>=0.24.0,<0.27.0",
    "tree-sitter-python>=0.23.0,<0.26.0",
    "tree-sitter-typescript>=0.23.0,<0.25.0",
    "pypdf>=5.0.0,<7.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.0.0",
    "pillow>=13.0.0",
    "torchvision>=0.29.2",
    "fonttools>=4.68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-PyYAML>=6.0.12,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/context_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["context_scout"]

[[tool.mypy.overrides]]
module = [
    "tree_sitter",
    "tree_sitter_python",
    "tree_sitter_typescript",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
