name: Enterprise Context Scout CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-verify:
    name: Backend Lint, Typecheck & Pytest (PG17 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: context_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCOUT_DB_ADMIN_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/context_scout
      SCOUT_AUTH_HMAC_SECRET: scout-github-actions-ci-hmac-secret-32-chars!!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --extra api --extra worker --extra gpu-train --extra dev

      - name: Bootstrap PostgreSQL 17 Schema via Alembic & Audit Forced RLS
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          APP_PW="$(openssl rand -hex 24)"
          echo "::add-mask::${APP_PW}"
          APP_URL="postgresql://scout_app_user:${APP_PW}@127.0.0.1:5432/context_scout"
          echo "SCOUT_DB_APP_PASSWORD=${APP_PW}" >> "$GITHUB_ENV"
          echo "SCOUT_DB_APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          export SCOUT_DB_APP_PASSWORD="$APP_PW"
          export SCOUT_DB_APP_URL="$APP_URL"
          uv run context-scout db upgrade
          uv run python -m context_scout.db.migrations_runner --lint-squawk
          uv run python .agents/skills/rls-pgtap-audit/scripts/check_rls_catalog.py

      - name: Run Ruff Linter
        run: uv run ruff check src tests

      - name: Run Mypy Strict Typechecker
        run: uv run mypy --strict src tests

      - name: Run Backend Test Suite & Evaluation Gate (PG17 + In-Memory CI Mode)
        run: |
          uv run pytest -q
          uv run python -m context_scout.evals.runner --in-memory \
            --output-json /tmp/m6_eval_report.json \
            --output-md /tmp/m6_eval_report.md

  frontend-verify:
    name: Frontend Strict TypeScript, ESLint, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (--max-warnings 0)
        run: npm run lint

      - name: Run TypeScript Strict Check
        run: npm run typecheck

      - name: Run Vitest Suite (60 Tests)
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
