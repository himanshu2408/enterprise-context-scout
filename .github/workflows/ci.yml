name: Enterprise Context Scout CI

on:
  push:
    branches: ["main", "feat/**", "refactor/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-static:
    name: Backend Lint, Format, Mypy & Squawk
    runs-on: ubuntu-latest
    env:
      SCOUT_AUTH_HMAC_SECRET: scout-github-actions-ci-hmac-secret-32-chars!!
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --extra api --extra worker --extra sidecar --extra gpu-train --extra cpu --extra dev

      - name: Verify Lockfile Consistency (uv lock --check)
        run: uv lock --check

      - name: Verify Pytest LPT Shard Partition Completeness
        run: uv run python scripts/ci_pytest_shard.py --summary --total-shards 6

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check src tests scripts examples
          uv run ruff format --check src tests scripts examples

      - name: Run Mypy Strict Typechecker
        run: uv run mypy --strict src tests scripts/ci_pytest_shard.py scripts/run_test_batches.py scripts/generate_aibom.py scripts/clean_and_enrich_corpus.py scripts/smoke_e2e_live_stack.py

      - name: Lint PostgreSQL 17 Alembic Migrations via Squawk
        run: uv run python -m context_scout.db.migrations_runner --lint-squawk

      - name: Install Helm, Terraform, Kubeconform & Trivy (SHA-256 Verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://get.helm.sh/helm-v3.17.1-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          echo "3b66f3cd28409f29832b1b35b43d9922959a32d795003149707fea84cbcd4469  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp && mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm" && chmod +x "$HOME/.local/bin/helm"
          curl -fsSL "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip" -o /tmp/terraform.zip
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  /tmp/terraform.zip" | sha256sum -c -
          unzip -o /tmp/terraform.zip terraform -d "$HOME/.local/bin" && chmod +x "$HOME/.local/bin/terraform"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp && mv /tmp/kubeconform "$HOME/.local/bin/kubeconform" && chmod +x "$HOME/.local/bin/kubeconform"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy && mv /tmp/trivy "$HOME/.local/bin/trivy" && chmod +x "$HOME/.local/bin/trivy"
          rm -rf /tmp/helm.tar.gz /tmp/linux-amd64 /tmp/terraform.zip /tmp/kubeconform.tar.gz /tmp/trivy.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Helm, Kubeconform, Trivy IaC, Multi-Cloud Terraform, Compose & CycloneDX AI-BOM
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          helm lint deploy/helm/context-scout
          helm lint deploy/helm/context-scout -f deploy/helm/context-scout/values-gcp-gke.yaml
          helm template context-scout deploy/helm/context-scout | kubeconform -strict -ignore-missing-schemas -summary
          helm template prod-scout deploy/helm/context-scout -f deploy/helm/context-scout/values-gcp-gke.yaml | kubeconform -strict -ignore-missing-schemas -summary
          trivy config --exit-code 1 --severity CRITICAL deploy/
          for mod in gcp-gke aws-eks azure-aks onprem-k8s; do
            terraform -chdir="deploy/terraform/$mod" fmt -check
            rm -rf "/tmp/tf-mod-$mod"
            cp -R "deploy/terraform/$mod" "/tmp/tf-mod-$mod"
            TF_DATA_DIR="/tmp/tf-ci-$mod" terraform -chdir="/tmp/tf-mod-$mod" init -backend=false -input=false >/dev/null
            TF_DATA_DIR="/tmp/tf-ci-$mod" terraform -chdir="/tmp/tf-mod-$mod" validate
          done
          POSTGRES_ADMIN_PASSWORD=ci-dummy REDIS_PASSWORD=ci-dummy MINIO_ROOT_USER=ci-dummy MINIO_ROOT_PASSWORD=ci-dummy POSTGRES_APP_PASSWORD=ci-dummy SCOUT_DB_APP_URL=postgresql://u:p@postgres/db SCOUT_AUTH_HMAC_SECRET=ci-dummy-secret-32-chars-minimum!! docker compose -f docker-compose.enterprise.yml config --quiet
          uv run python scripts/generate_aibom.py --output /tmp/ci-aibom.cdx.json

  backend-eval:
    name: Backend Milestone 6 Evaluation Gate (In-Memory)
    runs-on: ubuntu-latest
    env:
      SCOUT_AUTH_HMAC_SECRET: scout-github-actions-ci-hmac-secret-32-chars!!
      SCOUT_STORAGE_BACKEND: "memory"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache HuggingFace Model Weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-embeddinggemma-v2-${{ runner.os }}
          restore-keys: |
            hf-hub-embeddinggemma-v2-

      - name: Install Python dependencies
        run: uv sync --locked --extra api --extra worker --extra sidecar --extra gpu-train --extra cpu --extra dev

      - name: Run Milestone 6 Evaluation Gate (In-Memory CI Mode)
        run: |
          uv run python -m context_scout.evals.runner --in-memory --fail-under-threshold \
            --output-json /tmp/m6_eval_report.json \
            --output-md /tmp/m6_eval_report.md

  backend-pg17-seed:
    name: Bootstrap & Seed PostgreSQL 17 FORCE RLS Snapshot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: context_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCOUT_DB_ADMIN_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/context_scout
      SCOUT_AUTH_HMAC_SECRET: scout-github-actions-ci-hmac-secret-32-chars!!
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache HuggingFace Model Weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-embeddinggemma-v2-${{ runner.os }}
          restore-keys: |
            hf-hub-embeddinggemma-v2-

      - name: Cache Seeded PostgreSQL 17 Snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/scout-pg17-seed
          key: pg17-seed-v3-${{ hashFiles('sql/**', 'alembic.ini', 'pyproject.toml', 'uv.lock', 'src/context_scout/**', 'tests/fixtures/pg_isolation.py', 'examples/quant_dogfood/**') }}

      - name: Install Python dependencies & PostgreSQL client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          uv sync --locked --extra api --extra worker --extra sidecar --extra gpu-train --extra cpu --extra dev

      - name: Bootstrap Schema, Seed Corpora & Audit Forced RLS
        run: |
          mkdir -p "$HOME/.cache/scout-pg17-seed"
          DUMP_PATH="$HOME/.cache/scout-pg17-seed/context_scout.dump"
          APP_PW="$(openssl rand -hex 24)"
          echo "::add-mask::${APP_PW}"
          APP_URL="postgresql://scout_app_user:${APP_PW}@127.0.0.1:5432/context_scout"
          export SCOUT_DB_APP_PASSWORD="$APP_PW"
          export SCOUT_DB_APP_URL="$APP_URL"

          if [[ -s "$DUMP_PATH" ]]; then
            echo "Restoring cached PG17 seeded snapshot..."
            PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -v app_pw="$APP_PW" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'scout_app_user') THEN
              CREATE ROLE scout_app_user LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
            END IF;
          END
          $$;
          ALTER ROLE scout_app_user WITH PASSWORD :'app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          DROP DATABASE IF EXISTS context_scout;
          CREATE DATABASE context_scout;
          SQL
            PGPASSWORD=postgres_ci_password pg_restore -h 127.0.0.1 -p 5432 -U postgres -d context_scout --no-owner --exit-on-error "$DUMP_PATH"
            uv run context-scout db upgrade
          else
            echo "Seed cache miss: running Alembic upgrade and seeding PG17 corpora..."
            uv run context-scout db upgrade
            uv run alembic downgrade -1 && uv run alembic upgrade head
            uv run python -c "import os; from pathlib import Path; from tests.fixtures.pg_isolation import ensure_pg17_schema_and_seed_corpora; ensure_pg17_schema_and_seed_corpora(os.environ['SCOUT_DB_ADMIN_URL'], os.environ['SCOUT_DB_APP_URL'], Path.cwd())"
            PGPASSWORD=postgres_ci_password pg_dump -Fc -h 127.0.0.1 -p 5432 -U postgres -d context_scout -f "$DUMP_PATH"
          fi

          uv run alembic downgrade -1 && uv run alembic upgrade head
          uv run python .agents/skills/rls-pgtap-audit/scripts/check_rls_catalog.py
          ls -lh "$DUMP_PATH"

      - name: Upload Seeded PG17 Snapshot Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pg17-seeded-dump
          path: ~/.cache/scout-pg17-seed/context_scout.dump
          retention-days: 1
          if-no-files-found: error

  backend-pytest:
    name: Backend Pytest Shard ${{ matrix.shard }}/6 (PG17 + RLS)
    needs: [backend-pg17-seed]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: context_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCOUT_DB_ADMIN_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/context_scout
      SCOUT_AUTH_HMAC_SECRET: scout-github-actions-ci-hmac-secret-32-chars!!
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Restore HuggingFace Model Weights Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-embeddinggemma-v2-${{ runner.os }}
          restore-keys: |
            hf-hub-embeddinggemma-v2-

      - name: Download Seeded PG17 Snapshot Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pg17-seeded-dump
          path: /tmp/pg17-seed

      - name: Install Python dependencies & Restore Seeded PG17 Snapshot
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          uv sync --locked --extra api --extra worker --extra sidecar --extra gpu-train --extra cpu --extra dev
          APP_PW="$(openssl rand -hex 24)"
          echo "::add-mask::${APP_PW}"
          APP_URL="postgresql://scout_app_user:${APP_PW}@127.0.0.1:5432/context_scout"
          echo "SCOUT_DB_APP_PASSWORD=${APP_PW}" >> "$GITHUB_ENV"
          echo "SCOUT_DB_APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          export SCOUT_DB_APP_PASSWORD="$APP_PW"
          export SCOUT_DB_APP_URL="$APP_URL"

          PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -v app_pw="$APP_PW" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'scout_app_user') THEN
              CREATE ROLE scout_app_user LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
            END IF;
          END
          $$;
          ALTER ROLE scout_app_user WITH PASSWORD :'app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          DROP DATABASE IF EXISTS context_scout;
          CREATE DATABASE context_scout;
          SQL
          PGPASSWORD=postgres_ci_password pg_restore -h 127.0.0.1 -p 5432 -U postgres -d context_scout --no-owner --exit-on-error /tmp/pg17-seed/context_scout.dump
          uv run python .agents/skills/rls-pgtap-audit/scripts/check_rls_catalog.py
          git update-index -q --refresh || true

      - name: Install Helm and Terraform for IaC Tests (SHA-256 Verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://get.helm.sh/helm-v3.17.1-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          echo "3b66f3cd28409f29832b1b35b43d9922959a32d795003149707fea84cbcd4469  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp && mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm" && chmod +x "$HOME/.local/bin/helm"
          curl -fsSL "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip" -o /tmp/terraform.zip
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  /tmp/terraform.zip" | sha256sum -c -
          unzip -o /tmp/terraform.zip terraform -d "$HOME/.local/bin" && chmod +x "$HOME/.local/bin/terraform"
          rm -rf /tmp/helm.tar.gz /tmp/linux-amd64 /tmp/terraform.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Pytest Shard ${{ matrix.shard }}/6
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          SHARD_FILES="$(uv run python scripts/ci_pytest_shard.py --shard "${{ matrix.shard }}" --total-shards 6)"
          echo "Running shard ${{ matrix.shard }}/6 modules: ${SHARD_FILES}"
          # shellcheck disable=SC2086
          uv run pytest -q ${SHARD_FILES} --durations=10 --junitxml="/tmp/pytest-shard-${{ matrix.shard }}.xml"
          uv run python -c "import xml.etree.ElementTree as ET; root = ET.parse('/tmp/pytest-shard-${{ matrix.shard }}.xml').getroot(); suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite')); skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites); assert skipped == 0, f'Unexpected skipped tests in shard: {skipped}'"

  frontend-verify:
    name: Frontend Strict TypeScript, ESLint, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (--max-warnings 0)
        run: npm run lint

      - name: Run TypeScript Strict Check
        run: npm run typecheck

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

  container-verify:
    name: Build 4 Locked Containers, Verify < 2.0 GiB & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Trivy v0.76.2 (SHA-256 Verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy && mv /tmp/trivy "$HOME/.local/bin/trivy" && chmod +x "$HOME/.local/bin/trivy"
          rm -f /tmp/trivy.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build All 4 Docker Images & Enforce Slim Size Gate (< 2.0 GiB)
        run: |
          docker build -f deploy/docker/Dockerfile.webui -t ecs-ci-webui:pr7 .
          docker build -f deploy/docker/Dockerfile.adapter-sidecar -t ecs-ci-sidecar:pr7 .
          docker build --build-arg TORCH_BACKEND=cpu -f deploy/docker/Dockerfile.api -t ecs-ci-api:pr7 .
          docker build --build-arg TORCH_BACKEND=cpu -f deploy/docker/Dockerfile.worker -t ecs-ci-worker:pr7 .

          for img in ecs-ci-api:pr7 ecs-ci-worker:pr7; do
            sz="$(docker image inspect --format '{{.Size}}' "$img")"
            echo "$img size_bytes=$sz"
            if [[ "$sz" -ge 2147483648 ]]; then
              echo "ERROR: $img exceeds 2.0 GiB slim gate ($sz bytes)" >&2
              exit 1
            fi
          done

      - name: Hardened Non-Root Read-Only Container Boot Smoke
        run: |
          docker run --rm --user 65532:65532 --read-only --cap-drop=ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e HF_HUB_OFFLINE=1 ecs-ci-worker:pr7 worker --help | grep -q -- "--once"
          docker run --rm --user 65532:65532 --read-only --cap-drop=ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint /usr/bin/python3 ecs-ci-sidecar:pr7 -W error::RuntimeWarning -m context_scout.serving.adapter_sync_sidecar --help
          docker run --rm --user 65532:65532 --read-only --cap-drop=ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint /usr/bin/python3 ecs-ci-api:pr7 -c "import context_scout.api.main as m; assert m.app.version == '1.0.1', m.app.version"

      - name: Trivy CRITICAL Vulnerability & Secret Scan Across All 4 Images
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for img in ecs-ci-webui:pr7 ecs-ci-sidecar:pr7 ecs-ci-api:pr7 ecs-ci-worker:pr7; do
            echo "Scanning $img..."
            trivy image --pkg-types library --scanners vuln,secret --ignore-unfixed --severity CRITICAL --exit-code 1 "$img"
          done
