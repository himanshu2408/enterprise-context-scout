name: Release Supply Chain & SLSA Provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sbom-and-provenance:
    name: CycloneDX AI-BOM, 4-Image Digests & SLSA Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --extra api --extra worker --extra sidecar --extra cpu --extra dev

      - name: Generate CycloneDX v1.6 AI-BOM & Build Release Images
        run: |
          mkdir -p dist
          uv run python scripts/generate_aibom.py --repo-root . --output dist/aibom.cdx.json --public-key-out dist/aibom.pub

          docker build -f deploy/docker/Dockerfile.webui -t context-scout-webui:release .
          docker build -f deploy/docker/Dockerfile.adapter-sidecar -t context-scout-sidecar:release .
          docker build --build-arg TORCH_BACKEND=cpu -f deploy/docker/Dockerfile.api -t context-scout-api:release .
          docker build --build-arg TORCH_BACKEND=cpu -f deploy/docker/Dockerfile.worker -t context-scout-worker:release .

          {
            for img in context-scout-webui:release context-scout-sidecar:release context-scout-api:release context-scout-worker:release; do
              echo "$img $(docker image inspect --format '{{.Id}} {{.Size}}' "$img")"
            done
          } > dist/container-digests.txt

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload Release Supply-Chain Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-supply-chain-artifacts
          path: dist/
          retention-days: 30
          if-no-files-found: error
