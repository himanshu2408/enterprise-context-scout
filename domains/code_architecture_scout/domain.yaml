domain_id: "code_architecture_scout"
display_name: "Code Architecture & Implementation Scout"
base_model_id: "google/gemma-4-26B-A4B-it"
contextualizer_model_id: "google/gemma-4-E4B-it"
lora_adapter_id: "gemma4_26b_code_scout"
lora_adapter_path: "domains/code_architecture_scout/adapters/gemma4_26b_code_scout"
embedding_model_id: "google/embeddinggemma-2"
embedding_dimensions: 768
mcp_read_tools_allowed:
  - "code_repo_mcp:assemble_verified_context_pack"
  - "code_repo_mcp:search_code_trigram"
  - "code_repo_mcp:lookup_ast_symbol"
  - "code_repo_mcp:expand_ast_1hop_closure"
  - "code_repo_mcp:slice_file_lines"
  - "code_repo_mcp:list_repo_branches_and_mrs"
  - "code_repo_mcp:inspect_mr_overlay_diff"
  - "code_repo_mcp:slice_branch_or_mr_file"
  - "code_repo_mcp:search_github_issues"
  - "code_repo_mcp:search_ast_symbols"
  - "code_repo_mcp:get_symbol_definition"
  - "code_repo_mcp:get_symbol_callers"
  - "code_repo_mcp:grep_repo"
  - "code_repo_mcp:list_github_issues"
authority_rules:
  primary_truth_source: "code"
  require_out_of_sample_check: false
  require_transaction_cost_check: false
  freshness_half_life_days: 90
output_contract: "ImplementationContextPack"
description: "Polyglot enterprise codebases, AST dependency graphs, API contracts, security boundaries, and architecture decision records."
modalities:
  - "code"
  - "document"
  - "issues"
lora_enabled: true
default_scopes:
  - "public"
  - "public_eng"
  - "repo:code_architecture_scout"
  - "domain:code_architecture_scout"
sample_queries:
  - "How does PreFlightValidator enforce fail-closed provenance and citation checks?"
  - "How does RLSConnectionManager set tenant_id and principal_scopes on PostgreSQL sessions?"
  - "How does DeterministicSlicer hydrate CodeSlicePointer ranges from Git blobs?"
