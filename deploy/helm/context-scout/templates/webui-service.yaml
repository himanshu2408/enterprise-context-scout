apiVersion: v1
kind: Service
metadata:
  name: {{ include "context-scout.fullname" . }}-webui
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
  {{- with .Values.webui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.webui.service.type }}
  ports:
    - name: http
      port: {{ int .Values.webui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "context-scout.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webui
