{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.createGateway }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.gatewayName | quote }}
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "context-scout.fullname" . }}-route
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName | quote }}
      {{- if .Values.gateway.gatewayNamespace }}
      namespace: {{ .Values.gateway.gatewayNamespace | quote }}
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /.well-known/mcp
      backendRefs:
        - name: {{ include "context-scout.fullname" . }}-api
          port: {{ int .Values.api.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "context-scout.fullname" . }}-webui
          port: {{ int .Values.webui.service.port }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "context-scout.fullname" . }}-api-iap
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  default:
    {{- if .Values.gateway.iap.enabled }}
    iap:
      enabled: true
      oauth2ClientSecret:
        name: {{ .Values.gateway.iap.oauth2ClientSecretName | quote }}
    {{- end }}
    {{- if .Values.gateway.cloudArmor.enabled }}
    securityPolicy: {{ .Values.gateway.cloudArmor.securityPolicyName | quote }}
    {{- end }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "context-scout.fullname" . }}-api
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "context-scout.fullname" . }}-webui-iap
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  default:
    {{- if .Values.gateway.iap.enabled }}
    iap:
      enabled: true
      oauth2ClientSecret:
        name: {{ .Values.gateway.iap.oauth2ClientSecretName | quote }}
    {{- end }}
    {{- if .Values.gateway.cloudArmor.enabled }}
    securityPolicy: {{ .Values.gateway.cloudArmor.securityPolicyName | quote }}
    {{- end }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "context-scout.fullname" . }}-webui
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "context-scout.fullname" . }}
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .apiPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "context-scout.fullname" $ }}-api
                port:
                  number: {{ int $.Values.api.service.port }}
          {{- end }}
          {{- range .webuiPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "context-scout.fullname" $ }}-webui
                port:
                  number: {{ int $.Values.webui.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
