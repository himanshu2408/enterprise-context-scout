{{- if .Values.api.pdb.enabled }}
{{- $apiMin := ternary (int .Values.keda.api.minReplicas) (int .Values.api.replicaCount) .Values.keda.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "context-scout.fullname" . }}-api
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if le $apiMin 1 }}
  maxUnavailable: 1
  {{- else }}
  minAvailable: {{ int .Values.api.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "context-scout.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
