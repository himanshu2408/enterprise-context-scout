{{- if .Values.serviceAccount.create }}
{{- $root := . -}}
{{- range $component := list "api" "worker" "vllm" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "context-scout.serviceAccountName" (list $root $component) }}
  labels:
    {{- include "context-scout.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- $wiAnnotations := include "context-scout.workloadIdentityAnnotations" (list $root $component) }}
  {{- if or $root.Values.serviceAccount.annotations $wiAnnotations }}
  annotations:
    {{- with $root.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $wiAnnotations }}
    {{- $wiAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
