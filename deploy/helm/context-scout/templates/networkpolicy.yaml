  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "context-scout.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "context-scout.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: vllm
      ports:
        - protocol: TCP
          port: {{ int .Values.vllm.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "context-scout.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: zoekt
      ports:
        - protocol: TCP
          port: {{ int .Values.zoekt.port }}
    - to:
        {{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3307
        - protocol: TCP
          port: 6379
    {{- if .Values.networkPolicy.allowDnsEgress }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "context-scout.fullname" . }}-webui
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  podSelector:
    matchLabels:
      {{- include "context-scout.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int .Values.webui.port }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ int .Values.webui.port }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "context-scout.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ int .Values.api.port }}
    {{- if .Values.networkPolicy.allowDnsEgress }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
