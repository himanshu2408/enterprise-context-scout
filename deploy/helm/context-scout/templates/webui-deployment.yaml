apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "context-scout.fullname" . }}-webui
  labels:
    {{- include "context-scout.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: {{ .Values.webui.replicaCount }}
  selector:
    matchLabels:
      {{- include "context-scout.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        {{- include "context-scout.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      terminationGracePeriodSeconds: {{ int (.Values.webui.terminationGracePeriodSeconds | default 60) }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: webui
          image: {{ printf "%s:%s" .Values.webui.image.repository .Values.webui.image.tag | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ int .Values.webui.port }}
              protocol: TCP
          env:
            - name: TMPDIR
              value: "/tmp"
            - name: SCOUT_API_UPSTREAM
              value: {{ printf "http://%s-api:%d" (include "context-scout.fullname" .) (int .Values.api.service.port) | quote }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
