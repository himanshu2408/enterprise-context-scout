worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Writable temp paths under /tmp for readOnlyRootFilesystem: true
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /app/dist;
        index index.html;

        # Strict air-gapped security headers (zero external egress)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Populated at container start into /tmp by /docker-entrypoint.d/25-scout-resolver.sh;
        # glob include remains valid when /tmp is empty (e.g. standalone `nginx -t`).
        include /tmp/nginx-scout-resolver*.conf;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            set $scout_api_upstream "http://context-scout-api:8080";
            include /tmp/nginx-scout-api-override*.conf;
            proxy_pass $scout_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /mcp/ {
            set $scout_api_upstream "http://context-scout-api:8080";
            include /tmp/nginx-scout-api-override*.conf;
            proxy_pass $scout_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location = /.well-known/mcp {
            set $scout_api_upstream "http://context-scout-api:8080";
            include /tmp/nginx-scout-api-override*.conf;
            proxy_pass $scout_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location = /.well-known/oauth-protected-resource {
            set $scout_api_upstream "http://context-scout-api:8080";
            include /tmp/nginx-scout-api-override*.conf;
            proxy_pass $scout_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location ^~ /.well-known/oauth-protected-resource/ {
            set $scout_api_upstream "http://context-scout-api:8080";
            include /tmp/nginx-scout-api-override*.conf;
            proxy_pass $scout_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
